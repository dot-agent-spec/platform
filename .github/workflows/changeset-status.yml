name: Changeset

# Fails a pull request that changes a published package without declaring the
# change in a `.changeset/*.md` file. Changesets never reads commit messages, so
# the file is the only record `changeset version` turns into a version bump and
# a CHANGELOG entry. A change that needs no release (docs inside a package, a
# test-only edit, a Dependabot bump) declares that with `npx changeset add --empty`.
#
# No `npm ci`: `changeset status` reads only package.json files and git, so the
# CLI runs through npx at the version pinned in the root package.json. Keep the
# two in step.

on:
  pull_request:

permissions:
  contents: read

jobs:
  status:
    name: Changeset declared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--since` resolves where HEAD diverged from the base, which needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Against the pull request's own base, not main: the alpha and beta
      # branches keep every changeset until pre mode exits, so compared with
      # main a pull request into them would pass on changesets it did not add.
      # Skipped on two kinds of pull request whose diff holds version bumps
      # without the changesets behind them, because `changeset version`
      # consumed those: a release (`chore/release-*`, the /publish skill's
      # branch name), and the Forward-port workflow's (`forward-port/*`), which
      # carry main after a release. Their changes passed this check when each
      # changeset was added.
      - name: Check for a changeset
        if: ${{ !startsWith(github.head_ref, 'forward-port/') && !startsWith(github.head_ref, 'chore/release-') }}
        run: npx --yes @changesets/cli@2.31.1 status --since="origin/$GITHUB_BASE_REF"

      # The alpha and beta branches sit in pre mode. Merged into main in that
      # state, `.changeset/pre.json` turns the next stable release into a
      # prerelease; promotion runs `changeset pre exit` first.
      # Merging beta into alpha applies beta's pre.json without a conflict,
      # and alpha would then publish -beta.N under the beta dist-tag.
      - name: Pre mode matches the channel
        if: github.base_ref == 'alpha' || github.base_ref == 'beta'
        run: |
          tag=$(node -p "require('./.changeset/pre.json').tag" 2>/dev/null || echo none)
          if [ "$tag" != "$GITHUB_BASE_REF" ]; then
            echo "::error file=.changeset/pre.json::pre mode tag is '$tag' on a pull request into $GITHUB_BASE_REF; restore $GITHUB_BASE_REF's pre.json"
            exit 1
          fi

      - name: Pre mode stays off main
        if: github.base_ref == 'main'
        run: |
          if [ -f .changeset/pre.json ] && grep -q '"mode": *"pre"' .changeset/pre.json; then
            echo "::error file=.changeset/pre.json::pre mode is on; run 'npx changeset pre exit' before merging into main"
            exit 1
          fi
